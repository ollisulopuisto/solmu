name: Multi-attachment evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bridge-album-evidence.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          cache-generation: test-v1
      - name: Check formatting and fixed mapping
        run: |
          cargo fmt --all --check
          mbx test --locked --lib --features demo multi_attachment_message_maps_to_one_row_per_attachment -- --nocapture
          mbx test --locked --lib --features demo attachments_without_a_source_are_skipped -- --nocapture
          mbx test --locked --lib --features demo a_deleted_bridge_message_removes_all_its_parts -- --nocapture
          mbx build --locked --features demo
      - name: Capture fixed rendering
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-album-evidence"
          for theme in light dark; do
            target/debug/solmu --demo-shot "$RUNNER_TEMP/bridge-album-evidence/after-$theme.png" --demo-size 1180x1200 --demo-page "bridge-album,$theme" --demo-shot-delay 6000
          done
      - name: Restore old mapping and prove the tests catch it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/backend/beeper.rs')
          text = p.read_text()
          old = '    let usable = usable_attachments(m);\n    if usable.len() <= 1 {'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '    let usable = usable_attachments(m);\n    if true {\n        let _ = &usable;'))
          PY
          if mbx test --locked --lib --features demo multi_attachment_message_maps_to_one_row_per_attachment -- --nocapture > "$RUNNER_TEMP/bridge-album-evidence/before-test.log" 2>&1; then
            cat "$RUNNER_TEMP/bridge-album-evidence/before-test.log"
            echo 'Regression test did not catch the old mapping'; exit 1
          fi
          cat "$RUNNER_TEMP/bridge-album-evidence/before-test.log"
          grep -q 'every attachment gets its own row' "$RUNNER_TEMP/bridge-album-evidence/before-test.log"
          mbx build --locked --features demo
      - name: Capture old rendering
        run: |
          for theme in light dark; do
            target/debug/solmu --demo-shot "$RUNNER_TEMP/bridge-album-evidence/before-$theme.png" --demo-size 1180x1200 --demo-page "bridge-album,$theme" --demo-shot-delay 6000
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bridge-album-evidence
          path: ${{ runner.temp }}/bridge-album-evidence
          retention-days: 7
