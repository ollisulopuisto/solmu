name: Local hide demo evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/local-hide-evidence.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          cache-generation: test-v1
      - name: Build synthetic demo
        run: mbx build --locked --features demo
      - name: Capture normal and hidden messages and albums
        run: |
          mkdir -p "$RUNNER_TEMP/local-hide-shots"
          for theme in light dark; do
            for page in hidden-message-before hidden-message media-album hidden-album; do
              target/debug/solmu --demo-shot "$RUNNER_TEMP/local-hide-shots/$page-$theme.png" --demo-size 1180x1200 --demo-page "$page,$theme" --demo-shot-delay 6000
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: local-hide-shots
          path: ${{ runner.temp }}/local-hide-shots
          retention-days: 1
