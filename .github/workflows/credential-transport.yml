name: macOS package credential transport
on:
  pull_request:
    paths:
      - '.github/workflows/credential-transport.yml'
      - '.github/workflows/release.yml'
      - 'packaging/macos/*credential*'
      - 'packaging/macos/*transport*'
      - 'packaging/macos/secure_native_packages.rb'
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: gem install native-packages --version 0.11.0 --no-document
      - name: Load adapter with the exact pinned gem
        run: ruby packaging/macos/secure_native_packages.rb --help
      - name: Dummy credential transport regression checks
        run: ruby packaging/macos/test_credential_transport.rb
      - name: Native dummy-keychain smoke (no Apple credentials)
        run: python3 packaging/macos/test_keychain_transport.py -v
